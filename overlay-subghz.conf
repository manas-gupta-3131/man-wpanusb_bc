CONFIG_IEEE802154_CC13XX_CC26XX=n
CONFIG_IEEE802154_CC13XX_CC26XX_SUB_GHZ=y
CONFIG_NET_CONFIG_IEEE802154_DEV_NAME="IEEE802154_1"
CONFIG_NET_CONFIG_IEEE802154_CHANNEL=1
CONFIG_IEEE802154_CC13XX_CC26XX_SUB_GHZ_NUM_RX_BUF=6
CONFIG_NET_CONFIG_IEEE802154_RADIO_TX_POWER=20
CONFIG_IEEE802154_CC13XX_CC26XX_SUB_GHZ_DIV_SETUP_PA=1
CONFIG_WPANUSB_DEVICE_VALID_CHANNELS=0x000007FF

# Extended API configuration
CONFIG_WPANUSB_EXTENDED_API=y
CONFIG_WPANUSB_EXTENDED_API_TESTS=y

# Hardware info support
CONFIG_HWINFO=y

# Random number generation
CONFIG_ENTROPY_GENERATOR=y
